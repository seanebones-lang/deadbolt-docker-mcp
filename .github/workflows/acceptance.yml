name: Container acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: docker build --progress plain -t n11-deadbolt-docker:local .
      - run: python tests/acceptance.py n11-deadbolt-docker:local
      - run: python tests/install_gateway_cli.py "$RUNNER_TEMP/docker-mcp"
      - run: python tests/gateway_acceptance.py --cli "$RUNNER_TEMP/docker-mcp"
        env:
          DOCKER_MCP_IN_CONTAINER: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: container-${{ matrix.os }}
          path: |
            acceptance-report.json
            gateway-report.json
          if-no-files-found: warn
